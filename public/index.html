<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-CHat</title>
    <script src="/socket.io/socket.io.js"></script>
    <script defer src="./app.js"></script>
    <style>
        body {
            width: 100%;
            min-height: 100vh;
            box-sizing: border-box;
            background-color: #ffffff;
            background-image:
                linear-gradient(45deg, #efefef 25%, transparent 25%, transparent 75%, #efefef 75%, #efefef 100%),
                linear-gradient(45deg, #efefef 25%, white 25%, white 75%, #efefef 75%, #efefef 100%);
            background-position: 0 0, 10px 10px;
            background-size: 20px 20px;
            background-clip: border-box;
            background-repeat: repeat;
            background-attachment: scroll;
        }
    </style>
</head>

<body>
    <form action="/auth/regestor" method="POST"
        style="background-color: #fffbeb; max-width: 400px; margin: 2rem auto; padding: 2.5rem; border-radius: 16px; border: 1px solid #fde68a; box-shadow: 0 4px 6px -1px rgba(251, 191, 36, 0.1), 0 2px 4px -1px rgba(251, 191, 36, 0.06); font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <h2 style="margin: 0 0 1.5rem 0; color: #78350f; font-size: 1.75rem; font-weight: 700; text-align: center;">
            Create Account</h2>

        <div style="margin-bottom: 1.25rem;">
            <label for="name"
                style="display: block; margin-bottom: 0.5rem; color: #92400e; font-size: 0.875rem; font-weight: 600;">Full
                Name</label>
            <input type="text" id="name" name="name" required placeholder="John Doe"
                style="width: 100%; padding: 0.75rem; border: 1px solid #fcd34d; border-radius: 8px; background-color: #ffffff; color: #451a03; font-size: 1rem; box-sizing: border-box; outline: none; transition: border-color 0.2s;"
                onfocus="this.style.borderColor='#d97706'; this.style.boxShadow='0 0 0 3px rgba(217, 119, 6, 0.15)'"
                onblur="this.style.borderColor='#fcd34d'; this.style.boxShadow='none'">
        </div>

        <div style="margin-bottom: 1.25rem;">
            <label for="email"
                style="display: block; margin-bottom: 0.5rem; color: #92400e; font-size: 0.875rem; font-weight: 600;">Email
                Address</label>
            <input type="email" id="email" name="email" required placeholder="you@example.com"
                style="width: 100%; padding: 0.75rem; border: 1px solid #fcd34d; border-radius: 8px; background-color: #ffffff; color: #451a03; font-size: 1rem; box-sizing: border-box; outline: none; transition: border-color 0.2s;"
                onfocus="this.style.borderColor='#d97706'; this.style.boxShadow='0 0 0 3px rgba(217, 119, 6, 0.15)'"
                onblur="this.style.borderColor='#fcd34d'; this.style.boxShadow='none'">
        </div>

        <div style="margin-bottom: 2rem;">
            <label for="password"
                style="display: block; margin-bottom: 0.5rem; color: #92400e; font-size: 0.875rem; font-weight: 600;">Password</label>
            <input type="password" id="password" name="password" required placeholder="••••••••"
                style="width: 100%; padding: 0.75rem; border: 1px solid #fcd34d; border-radius: 8px; background-color: #ffffff; color: #451a03; font-size: 1rem; box-sizing: border-box; outline: none; transition: border-color 0.2s;"
                onfocus="this.style.borderColor='#d97706'; this.style.boxShadow='0 0 0 3px rgba(217, 119, 6, 0.15)'"
                onblur="this.style.borderColor='#fcd34d'; this.style.boxShadow='none'">
        </div>

        <button type="submit"
            style="width: 100%; padding: 0.85rem; background-color: #d97706; color: #ffffff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background-color 0.2s; box-shadow: 0 2px 4px rgba(217, 119, 6, 0.2);"
            onmouseover="this.style.backgroundColor='#b45309'" onmouseout="this.style.backgroundColor='#d97706'">
            Sign Up
        </button>
    </form>

</body>

</html>
