<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Amber Chat</title>
<style>
:root {
  --bg: #fef3c7;
  --bg-soft: #fffbeb;
  --panel: #ffffff;
  --primary: #f59e0b;
  --primary-dark: #d97706;
  --primary-darker: #b45309;
  --text: #451a03;
  --text-soft: #78350f;
  --text-muted: #92400e;
  --border: #fde68a;
  --border-soft: #fcd34d;
  --success: #10b981;
  --danger: #ef4444;
  --shadow: 0 10px 30px rgba(120, 53, 15, 0.12);
  --shadow-soft: 0 6px 18px rgba(120, 53, 15, 0.08);
}
* { margin: 0; padding: 0; box-sizing: border-box; font-family: ui-sans, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
body { display: flex; height: 100vh; background: radial-gradient(120deg, #fff7ed, #fef3c7); color: var(--text); overflow: hidden; }

.left-panel {
  width: 340px; height: 100%; background: linear-gradient(180deg, #fffbeb, #fff7ed);
  border-right: 1px solid var(--border); display: flex; flex-direction: column; box-shadow: var(--shadow-soft);
}
.right-panel { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; }

.panel-header {
  height: 60px; min-height: 60px; background: linear-gradient(90deg, var(--primary), #fbbf24);
  color: white; display: flex; align-items: center; justify-content: space-between; padding: 0 1rem; font-weight: 700;
}
.user-list { flex: 1; overflow-y: auto; padding: 0.5rem; }

.user-item {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 0.6rem 0.7rem; margin-bottom: 0.4rem; background: var(--panel);
  border: 1px solid var(--border-soft); border-radius: 12px; cursor: pointer;
  transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
}
.user-item:hover { border-color: var(--primary); transform: translateY(-1px); box-shadow: var(--shadow-soft); }
.user-item.active-chat { background: linear-gradient(135deg, #fef08a, #fff7ed); border-color: var(--primary); }

.user-info { display: flex; align-items: center; gap: 0.7rem; min-width: 0; }
.avatar {
  width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--primary-dark), #fbbf24);
  color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; user-select: none;
}
.status-dot {
  width: 10px; height: 10px; border-radius: 50%; border: 2px solid white; background: #9ca3af;
  position: absolute; bottom: 0; right: 0;
}
.status-dot.online { background: var(--success); box-shadow: 0 0 6px var(--success); }

.user-meta { display: flex; flex-direction: column; min-width: 0; }
.username { font-weight: 700; font-size: 0.92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status-text { font-size: 0.7rem; color: var(--text-soft); }

.action-area { display: flex; align-items: center; gap: 6px; }
.connect-btn {
  padding: 0.4rem 0.7rem; background: var(--primary-dark); color: white; border: none;
  border-radius: 8px; font-size: 0.75rem; font-weight: 700; cursor: pointer;
}
.connect-btn.confirm { background: var(--success); }
.friends { font-size: 0.7rem; color: var(--success); font-weight: 800; }

.chat-container {
  flex: 1; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 0.5rem;
}
.empty-chat {
  flex: 1; display: flex; align-items: center; justify-content: center;
  color: var(--text-soft); text-align: center; font-size: 0.95rem; opacity: 0.8;
}

.msg-row { display: flex; flex-direction: column; width: 100%; }
.message {
  max-width: min(60%, 620px); padding: 0.6rem 0.85rem; border-radius: 14px;
  font-size: 0.95rem; overflow-wrap: anywhere; white-space: pre-wrap; line-height: 1.3;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.message.sent {
  background: linear-gradient(135deg, #fde68a, #fff7ed); color: #78350f;
  align-self: flex-end; border-bottom-right-radius: 4px;
}
.message.received {
  background: white; color: #451a03; align-self: flex-start;
  border-bottom-left-radius: 4px; border: 1px solid var(--border-soft);
}
.msg-meta { font-size: 0.66rem; color: #92400e; margin-top: 2px; display: flex; gap: 5px; align-items: center; }
.msg-row.sent .msg-meta { align-self: flex-end; }
.msg-row.received .msg-meta { align-self: flex-start; }
.read-status { font-weight: 800; }
.read-status.read { color: var(--success); }
.read-status.unread { color: #9ca3af; }

/* Media in messages */
.message img {
  max-width: 100%; border-radius: 8px; margin-top: 4px; display: block;
}
.message video {
  max-width: 100%; border-radius: 8px; margin-top: 4px; display: block;
}
.file-link {
  display: inline-block; margin-top: 4px; color: var(--primary-darker); font-weight: 700; text-decoration: none;
}
.file-link:hover { text-decoration: underline; }

.chat-input-area {
  min-height: 70px; background: linear-gradient(180deg, #fffbeb, #fff7ed);
  border-top: 1px solid var(--border); display: flex; align-items: center; padding: 0 1rem; gap: 0.6rem;
}
.message-input {
  flex: 1; min-width: 0; padding: 0.7rem 1rem; border: 1px solid var(--border-soft);
  border-radius: 999px; outline: none; font-size: 0.95rem; background: white; color: var(--text);
}
.message-input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(245,158,11,0.12); }

.send-btn, .attach-btn, .call-btn, .class-btn {
  padding: 0.65rem 1rem; background: linear-gradient(90deg, var(--primary-dark), #f59e0b);
  color: white; border: none; border-radius: 999px; font-weight: 700; font-size: 0.9rem; cursor: pointer;
}
.attach-btn, .call-btn, .class-btn {
  background: linear-gradient(90deg, #0ea5e9, #0284c7);
}
.class-btn {
  background: linear-gradient(90deg, #10b981, #059669);
}
.send-btn:disabled, .message-input:disabled { opacity: 0.55; cursor: not-allowed; }

.video-area {
  padding: 0.6rem 1rem; background: #fff7ed; border-top: 1px solid var(--border);
  display: none; gap: 0.6rem; align-items: center;
}
.video-area.active { display: flex; }
.video-btn {
  padding: 0.5rem 0.9rem; background: var(--danger); color: white; border: none;
  border-radius: 8px; font-weight: 700; cursor: pointer;
}
video.remote-video, video.local-video {
  width: 180px; height: 120px; background: #000; border-radius: 8px; object-fit: cover;
}

@media (max-width: 700px) {
  .left-panel { width: 100%; }
  .right-panel { display: none; }
  .left-panel.chat-open { display: none; }
  .right-panel.chat-open { display: flex; }
  .message { max-width: 80%; }
}
</style>
</head>
<body>

<div class="left-panel">
  <div class="panel-header">
    <span>Amber Directory</span>
    <button class="class-btn" id="global-class-btn" title="Start/End Class with active user">Class</button>
  </div>
  <div class="user-list"></div>
</div>

<div class="right-panel">
  <div class="panel-header" id="chat-header">
    <span>Select a connected user to begin chatting</span>
    <div style="display:flex;gap:6px;">
      <button class="call-btn" id="call-btn" disabled>Video Call</button>
    </div>
  </div>

  <div class="chat-container">
    <div class="empty-chat">Select a connected user to begin chatting</div>
  </div>

  <div class="video-area" id="video-area">
    <video class="local-video" id="local-video" autoplay muted></video>
    <video class="remote-video" id="remote-video" autoplay></video>
    <button class="video-btn" id="end-call-btn">End Call</button>
  </div>

  <div class="chat-input-area">
    <input type="file" id="file-input" style="display:none" />
    <button class="attach-btn" id="attach-btn">Attach</button>
    <input class="message-input" placeholder="Type a message..." disabled />
    <button class="send-btn" disabled>Send</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const urlParams = new URLSearchParams(window.location.search);
const myEmail = urlParams.get("user");

let activeChatUser = null;
let activeChatName = null;

// Video call
let localStream = null;
let remoteStream = null;
let peerConnection = null;
let inCall = false;
const rtcConfig = {
  iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
};

const userList = document.querySelector(".user-list");
const chatHeader = document.getElementById("chat-header");
const chatContainer = document.querySelector(".chat-container");
const messageInput = document.querySelector(".message-input");
const sendButton = document.querySelector(".send-btn");
const attachButton = document.getElementById("attach-btn");
const fileInput = document.getElementById("file-input");
const callButton = document.getElementById("call-btn");
const endCallButton = document.getElementById("end-call-btn");
const videoArea = document.getElementById("video-area");
const localVideo = document.getElementById("local-video");
const remoteVideo = document.getElementById("remote-video");
const globalClassBtn = document.getElementById("global-class-btn");

if (!myEmail) window.location.href = "/";

function safeId(email) { return encodeURIComponent(email).replace(/%/g, "-"); }
function getUserItem(email) { return document.getElementById(`item-${safeId(email)}`); }
function getActionArea(email) { return document.getElementById(`action-${safeId(email)}`); }
function getStatusDot(email) { return document.getElementById(`status-${safeId(email)}`); }
function getStatusText(email) { return document.getElementById(`text-${safeId(email)}`); }

function createActionButton(text, type, handler, email) {
  const button = document.createElement("button");
  button.className = `connect-btn ${type || ""}`;
  button.textContent = text;
  button.addEventListener("click", e => { e.stopPropagation(); handler(email); });
  return button;
}

function createUserItem(user) {
  const item = document.createElement("div");
  item.className = "user-item";
  item.id = `item-${safeId(user.email)}`;
  if (activeChatUser === user.email) item.classList.add("active-chat");

  const userInfo = document.createElement("div");
  userInfo.className = "user-info";

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = (user.name || user.email || "?").substring(0, 2).toUpperCase();

  const statusDot = document.createElement("div");
  statusDot.className = `status-dot ${user.isOnline ? "online" : ""}`;
  statusDot.id = `status-${safeId(user.email)}`;

  const userMeta = document.createElement("div");
  userMeta.className = "user-meta";

  const username = document.createElement("span");
  username.className = "username";
  username.textContent = user.name || user.email;

  const statusText = document.createElement("span");
  statusText.className = "status-text";
  statusText.id = `text-${safeId(user.email)}`;
  statusText.textContent = user.isOnline ? "Online" : "Offline";

  userMeta.appendChild(username);
  userMeta.appendChild(statusText);

  userInfo.appendChild(avatar);
  userInfo.appendChild(statusDot);
  userInfo.appendChild(userMeta);

  const actionArea = document.createElement("div");
  actionArea.id = `action-${safeId(user.email)}`;
  actionArea.className = "action-area";

  if (user.isConnected) {
    const friends = document.createElement("span");
    friends.className = "friends";
    friends.textContent = "Friends";
    actionArea.appendChild(friends);
    item.addEventListener("click", () => openChat(user.email, user.name || user.email));
  } else {
    const button = createActionButton("Connect", "", requestConnection, user.email);
    actionArea.appendChild(button);
  }

  item.appendChild(userInfo);
  item.appendChild(actionArea);
  return item;
}

async function loadDirectory() {
  try {
    const res = await fetch(`/api/users?user=${encodeURIComponent(myEmail)}`);
    if (!res.ok) throw new Error("Failed to load users");
    const users = await res.json();
    userList.innerHTML = "";
    if (!Array.isArray(users) || users.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty-chat";
      empty.textContent = "No users available";
      userList.appendChild(empty);
      return;
    }
    users.forEach(user => {
      if (!user.email || user.email === myEmail) return;
      userList.appendChild(createUserItem(user));
    });
  } catch (e) {
    userList.innerHTML = "";
    const empty = document.createElement("div");
    empty.className = "empty-chat";
    empty.textContent = "Unable to load users";
    userList.appendChild(empty);
  }
}

function requestConnection(targetEmail) {
  if (!targetEmail || targetEmail === myEmail) return;
  socket.emit("send-connect-request", { myEmail, targetEmail });
  const actionArea = getActionArea(targetEmail);
  if (!actionArea) return;
  actionArea.innerHTML = "";
  const requested = document.createElement("span");
  requested.className = "requested";
  requested.textContent = "Requested";
  actionArea.appendChild(requested);
}

function acceptConnection(targetEmail) {
  if (!targetEmail) return;
  socket.emit("confirm-connection", { myEmail, targetEmail });
}

async function openChat(targetEmail, targetName) {
  if (!targetEmail) return;
  activeChatUser = targetEmail;
  activeChatName = targetName || targetEmail;

  document.querySelectorAll(".user-item").forEach(i => i.classList.remove("active-chat"));
  const item = getUserItem(targetEmail);
  if (item) item.classList.add("active-chat");

  chatHeader.querySelector("span").textContent = `Chat with ${activeChatName}`;
  callButton.disabled = false;

  messageInput.disabled = false;
  sendButton.disabled = false;
  messageInput.focus();

  socket.emit("mark-as-read", { myEmail, targetEmail });
  chatContainer.innerHTML = "";

  try {
    const res = await fetch(`/api/history?user=${encodeURIComponent(myEmail)}&target=${encodeURIComponent(targetEmail)}`);
    if (!res.ok) throw new Error("Failed to load history");
    const msgs = await res.json();
    if (!Array.isArray(msgs) || msgs.length === 0) {
      showEmptyChat("No messages yet");
      return;
    }
    msgs.forEach(m => appendToScreen(m));
    scrollChatToBottom();
  } catch (e) {
    showEmptyChat("Unable to load chat history");
  }

  if (window.innerWidth <= 700) {
    document.querySelector(".left-panel").classList.add("chat-open");
    document.querySelector(".right-panel").classList.add("chat-open");
  }
}

function showEmptyChat(text) {
  chatContainer.innerHTML = "";
  const empty = document.createElement("div");
  empty.className = "empty-chat";
  empty.textContent = text;
  chatContainer.appendChild(empty);
}

function sendMessage() {
  const text = messageInput.value.trim();
  if (!text || !activeChatUser) return;
  socket.emit("send-chat-message", { myEmail, targetEmail: activeChatUser, text });
  messageInput.value = "";
  messageInput.focus();
}

function appendToScreen(msg) {
  if (!msg || !msg.sender) return;
  const isMe = msg.sender === myEmail;
  const row = document.createElement("div");
  row.className = `msg-row ${isMe ? "sent" : "received"}`;

  const message = document.createElement("div");
  message.className = `message ${isMe ? "sent" : "received"}`;

  if (msg.type === "text") {
    message.textContent = msg.text || "";
  } else if (msg.type === "image") {
    message.textContent = msg.text || "";
    const img = document.createElement("img");
    img.src = msg.fileUrl;
    img.alt = msg.filename || "image";
    message.appendChild(img);
  } else if (msg.type === "video") {
    message.textContent = msg.text || "";
    const vid = document.createElement("video");
    vid.src = msg.fileUrl;
    vid.controls = true;
    message.appendChild(vid);
  } else if (msg.type === "file") {
    message.textContent = msg.text || "";
    const link = document.createElement("a");
    link.href = msg.fileUrl;
    link.className = "file-link";
    link.textContent = `📎 ${msg.filename || "file"}`;
    link.download = "";
    message.appendChild(link);
  }

  const meta = document.createElement("div");
  meta.className = "msg-meta";
  const ts = document.createElement("span");
  ts.textContent = msg.timestamp || "";
  meta.appendChild(ts);

  if (isMe) {
    const status = document.createElement("span");
    status.className = `read-status ${msg.read ? "read" : "unread"}`;
    status.textContent = "✓✓";
    meta.appendChild(status);
  }

  row.appendChild(message);
  row.appendChild(meta);
  chatContainer.appendChild(row);
  scrollChatToBottom();
}

function scrollChatToBottom() {
  requestAnimationFrame(() => { chatContainer.scrollTop = chatContainer.scrollHeight; });
}

function updateUserStatus(email, online) {
  const dot = getStatusDot(email);
  const text = getStatusText(email);
  if (!dot || !text) return;
  const wasOnline = dot.classList.contains("online");
  dot.classList.toggle("online", Boolean(online));
  text.textContent = online ? "Online" : "Offline";
}

function handleIncomingConnectionRequest(data) {
  if (!data || !data.fromEmail) return;
  const actionArea = getActionArea(data.fromEmail);
  if (!actionArea) return;
  actionArea.innerHTML = "";
  const button = createActionButton("Confirm", "confirm", acceptConnection, data.fromEmail);
  actionArea.appendChild(button);
}

// Attach & upload
attachButton.addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", async () => {
  const file = fileInput.files[0];
  if (!file || !activeChatUser) { fileInput.value = ""; return; }

  const formData = new FormData();
  formData.append("file", file);

  try {
    const res = await fetch("/api/upload", { method: "POST", body: formData });
    if (!res.ok) throw new Error("Upload failed");
    const data = await res.json();

    const fileType = file.type.startsWith("image/") ? "image"
      : file.type.startsWith("video/") ? "video" : "file";

    socket.emit("send-file-message", {
      myEmail,
      targetEmail: activeChatUser,
      fileUrl: data.url,
      filename: data.filename,
      mimetype: data.mimetype,
      fileType
    });

    appendToScreen({
      type: fileType,
      sender: myEmail,
      receiver: activeChatUser,
      fileUrl: data.url,
      filename: data.filename,
      mimetype: data.mimetype,
      timestamp: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
      read: false,
      text: ""
    });

  } catch (e) {
    alert("Upload failed");
  } finally {
    fileInput.value = "";
  }
});

// Video call
callButton.addEventListener("click", async () => {
  if (!activeChatUser || inCall) return;
  inCall = true;
  videoArea.classList.add("active");

  try {
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    localVideo.srcObject = localStream;

    peerConnection = new RTCPeerConnection(rtcConfig);
    localStream.getTracks().forEach(track => peerConnection.addTrack(track));

    peerConnection.ontrack = event => {
      remoteVideo.srcObject = event.streams[0];
    };

    peerConnection.onicecandidate = event => {
      if (event.candidate) {
        socket.emit("ice-candidate", {
          myEmail,
          targetEmail: activeChatUser,
          candidate: event.candidate
        });
      }
    };

    const offer = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offer);

    socket.emit("call-offer", {
      myEmail,
      targetEmail: activeChatUser,
      offer
    });

  } catch (e) {
    alert("Camera/mic access failed");
    endCall();
  }
});

endCallButton.addEventListener("click", endCall);

function endCall() {
  inCall = false;
  videoArea.classList.remove("active");
  if (peerConnection) {
    peerConnection.close();
    peerConnection = null;
  }
  if (localStream) {
    localStream.getTracks().forEach(t => t.stop());
    localStream = null;
  }
  localVideo.srcObject = null;
  remoteVideo.srcObject = null;
}

// Class signaling
globalClassBtn.addEventListener("click", () => {
  if (!activeChatUser) return;
  // Simple toggle: if not in class, start; else end
  if (!globalClassBtn.dataset.active) {
    socket.emit("start-class", { myEmail, targetEmail: activeChatUser });
    globalClassBtn.dataset.active = "true";
    globalClassBtn.textContent = "End Class";
  } else {
    socket.emit("end-class", { myEmail, targetEmail: activeChatUser });
    delete globalClassBtn.dataset.active;
    globalClassBtn.textContent = "Class";
  }
});

// Socket events
socket.on("connect", () => {
  socket.emit("register-online", myEmail);
});

socket.on("status-update", data => {
  if (!data || !data.email) return;
  updateUserStatus(data.email, data.online);
});

socket.on("receive-connect-request", data => {
  handleIncomingConnectionRequest(data);
});

socket.on("connection-established", () => {
  loadDirectory();
});

socket.on("receive-chat-message", msg => {
  if (!msg || !msg.sender) return;
  if (activeChatUser === msg.sender) {
    appendToScreen(msg);
    socket.emit("mark-as-read", { myEmail, targetEmail: activeChatUser });
  } else {
    // Could show notification here
  }
});

socket.on("message-sent-confirmation", msg => {
  if (!msg) return;
  if (activeChatUser === msg.receiver) appendToScreen(msg);
});

socket.on("messages-were-read", data => {
  if (!data || activeChatUser !== data.byUser) return;
  document.querySelectorAll(".read-status.unread").forEach(s => {
    s.classList.remove("unread");
    s.classList.add("read");
  });
});

// Video call remote events
socket.on("call-offer", async data => {
  if (data.from !== activeChatUser) return;
  if (inCall) return;
  inCall = true;
  videoArea.classList.add("active");

  try {
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    localVideo.srcObject = localStream;

    peerConnection = new RTCPeerConnection(rtcConfig);
    localStream.getTracks().forEach(track => peerConnection.addTrack(track));

    peerConnection.ontrack = event => {
      remoteVideo.srcObject = event.streams[0];
    };

    peerConnection.onicecandidate = event => {
      if (event.candidate) {
        socket.emit("ice-candidate", {
          myEmail,
          targetEmail: data.from,
          candidate: event.candidate
        });
      }
    };

    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
    const answer = await peerConnection.createAnswer();
    await peerConnection.setLocalDescription(answer);

    socket.emit("call-answer", {
      myEmail,
      targetEmail: data.from,
      answer
    });
  } catch (e) {
    alert("Camera/mic access failed");
    endCall();
  }
});

socket.on("call-answer", async data => {
  if (data.from !== activeChatUser || !peerConnection) return;
  await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
});

socket.on("ice-candidate", async data => {
  if (data.from !== activeChatUser || !peerConnection) return;
  try {
    await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
  } catch (e) {
    // ignore
  }
});

// Class events
socket.on("class-started", data => {
  if (data.by !== activeChatUser) return;
  globalClassBtn.dataset.active = "true";
  globalClassBtn.textContent = "End Class";
  alert(`Class started by ${data.by}`);
});

socket.on("class-ended", data => {
  if (data.by !== activeChatUser) return;
  delete globalClassBtn.dataset.active;
  globalClassBtn.textContent = "Class";
  alert(`Class ended by ${data.by}`);
});

messageInput.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

sendButton.addEventListener("click", sendMessage);

window.addEventListener("resize", () => {
  if (window.innerWidth > 700) {
    document.querySelector(".left-panel").classList.remove("chat-open");
    document.querySelector(".right-panel").classList.remove("chat-open");
  }
});

document.addEventListener("DOMContentLoaded", () => {
  loadDirectory();
});
</script>
