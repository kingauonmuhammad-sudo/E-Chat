<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Amber Secure Chat</title>
<style>
:root {
  --bg: #fef3c7;
  --bg-soft: #fffbeb;
  --panel: #ffffff;
  --primary: #f59e0b;
  --primary-dark: #d97706;
  --primary-darker: #b45309;
  --text: #451a03;
  --text-soft: #78350f;
  --border: #fde68a;
  --border-soft: #fcd34d;
  --success: #10b981;
  --danger: #ef4444;
  --muted: #9ca3af;
  --shadow: 0 10px 30px rgba(120, 53, 15, 0.12);
  --shadow-soft: 0 6px 18px rgba(120, 53, 15, 0.08);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: ui-sans, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, sans-serif;
}

body {
  display: flex;
  height: 100vh;
  background: radial-gradient(120deg, #fff7ed, #fef3c7);
  color: var(--text);
  overflow: hidden;
}

/* Panels */
.left-panel {
  width: 360px;
  height: 100%;
  background: linear-gradient(180deg, #fffbeb, #fff7ed);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-soft);
  z-index: 2;
}

.right-panel {
  flex: 1;
  min-width: 0;
  height: 100%;
  background: linear-gradient(135deg, rgba(254, 243, 199, 0.25), rgba(255, 255, 255, 0.6));
  display: flex;
  flex-direction: column;
}

/* Header */
.panel-header {
  height: 64px;
  min-height: 64px;
  background: linear-gradient(90deg, var(--primary), #fbbf24);
  color: white;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 1rem;
  font-size: 1.05rem;
  font-weight: 700;
  letter-spacing: 0.2px;
  box-shadow: 0 2px 10px rgba(245, 158, 11, 0.25);
}

.header-title {
  display: flex;
  align-items: center;
  gap: 10px;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.icon-btn {
  background: rgba(255, 255, 255, 0.18);
  border: 1px solid rgba(255, 255, 255, 0.35);
  color: white;
  border-radius: 10px;
  padding: 6px 10px;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  transition: 0.15s ease;
}

.icon-btn:hover {
  background: rgba(255, 255, 255, 0.28);
}

/* User list */
.user-list {
  flex: 1;
  overflow-y: auto;
  padding: 0.6rem;
  scroll-behavior: smooth;
}

.user-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0.7rem 0.75rem;
  margin-bottom: 0.5rem;
  background: var(--panel);
  border: 1px solid var(--border-soft);
  border-radius: 14px;
  cursor: pointer;
  transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
  position: relative;
}

.user-item:hover {
  border-color: var(--primary);
  transform: translateY(-1px);
  box-shadow: var(--shadow-soft);
}

.user-item.active-chat {
  background: linear-gradient(135deg, #fef08a, #fff7ed);
  border-color: var(--primary);
  box-shadow: 0 8px 22px rgba(245, 158, 11, 0.18);
}

.user-info {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  min-width: 0;
}

.avatar-container {
  position: relative;
  width: 44px;
  height: 44px;
  min-width: 44px;
}

.avatar {
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, var(--primary-dark), #fbbf24);
  color: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 0.95rem;
  user-select: none;
  box-shadow: 0 4px 12px rgba(217, 119, 6, 0.35);
}

.status-dot {
  position: absolute;
  bottom: 0;
  right: 0;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: 2px solid white;
  background: var(--muted);
  box-shadow: 0 0 4px rgba(0,0,0,0.15);
  transition: background 0.15s ease, box-shadow 0.15s ease;
}

.status-dot.online {
  background: var(--success);
  box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
}

.alert-dot {
  position: absolute;
  top: -2px;
  left: -2px;
  width: 12px;
  height: 12px;
  background: var(--danger);
  border-radius: 50%;
  border: 2px solid white;
  display: none;
  box-shadow: 0 0 6px rgba(239, 68, 68, 0.7);
}

.alert-dot.active {
  display: block;
  animation: pulse-red 1.2s infinite;
}

@keyframes pulse-red {
  0% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.15); opacity: 0.85; }
  100% { transform: scale(1); opacity: 1; }
}

.user-meta {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.username {
  font-weight: 700;
  font-size: 0.95rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text);
}

.status-text {
  font-size: 0.73rem;
  color: var(--text-soft);
  margin-top: 1px;
}

.action-area {
  display: flex;
  align-items: center;
  gap: 6px;
}

.connect-btn {
  padding: 0.45rem 0.85rem;
  background: var(--primary-dark);
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 0.78rem;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.12s ease, transform 0.08s ease;
}

.connect-btn:hover {
  background: var(--primary-darker);
  transform: translateY(-1px);
}

.connect-btn.confirm {
  background: var(--success);
}

.connect-btn.confirm:hover {
  background: #059669;
}

.requested {
  font-size: 0.73rem;
  color: var(--primary-darker);
  font-weight: 700;
}

.friends {
  font-size: 0.73rem;
  color: var(--success);
  font-weight: 800;
  letter-spacing: 0.3px;
}

/* Chat area */
.chat-container {
  flex: 1;
  padding: 1.2rem 1.4rem;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
  scroll-behavior: smooth;
}

.empty-chat {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-soft);
  text-align: center;
  font-size: 0.95rem;
  opacity: 0.8;
}

/* Messages */
.msg-row {
  display: flex;
  flex-direction: column;
  width: 100%;
}

.message {
  max-width: min(60%, 620px);
  padding: 0.7rem 0.95rem;
  border-radius: 16px;
  font-size: 0.97rem;
  position: relative;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
  line-height: 1.35;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}

.message.sent {
  background: linear-gradient(135deg, #fde68a, #fff7ed);
  color: #78350f;
  align-self: flex-end;
  border-bottom-right-radius: 4px;
}

.message.received {
  background: white;
  color: #451a03;
  align-self: flex-start;
  border-bottom-left-radius: 4px;
  border: 1px solid var(--border-soft);
}

.message:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 16px rgba(0,0,0,0.08);
}

.msg-meta {
  font-size: 0.68rem;
  color: #92400e;
  margin-top: 3px;
  display: flex;
  gap: 6px;
  align-items: center;
}

.msg-row.sent .msg-meta {
  align-self: flex-end;
}

.msg-row.received .msg-meta {
  align-self: flex-start;
}

.read-status {
  font-weight: 800;
  letter-spacing: 0.4px;
}

.read-status.read {
  color: var(--success);
}

.read-status.unread {
  color: var(--muted);
}

/* Input area */
.chat-input-area {
  min-height: 72px;
  background: linear-gradient(180deg, #fffbeb, #fff7ed);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 1.2rem;
  gap: 0.9rem;
}

.message-input {
  flex: 1;
  min-width: 0;
  padding: 0.8rem 1.1rem;
  border: 1px solid var(--border-soft);
  border-radius: 999px;
  outline: none;
  font-size: 0.97rem;
  background: white;
  color: var(--text);
  transition: border-color 0.12s ease, box-shadow 0.12s ease;
}

.message-input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.12);
}

.send-btn {
  padding: 0.75rem 1.4rem;
  background: linear-gradient(90deg, var(--primary-dark), #f59e0b);
  color: white;
  border: none;
  border-radius: 999px;
  font-weight: 700;
  font-size: 0.92rem;
  cursor: pointer;
  transition: filter 0.12s ease, transform 0.08s ease;
  box-shadow: 0 4px 14px rgba(217, 119, 6, 0.35);
}

.send-btn:hover:not(:disabled) {
  filter: brightness(1.05);
  transform: translateY(-1px);
}

.send-btn:disabled,
.message-input:disabled {
  opacity: 0.55;
  cursor: not-allowed;
  transform: none;
}

/* Responsive */
@media (max-width: 700px) {
  .left-panel {
    width: 100%;
  }

  .right-panel {
    display: none;
  }

  .left-panel.chat-open {
    display: none;
  }

  .right-panel.chat-open {
    display: flex;
  }

  .message {
    max-width: 80%;
  }
}
</style>
</head>

<body>

<div class="left-panel">
  <div class="panel-header">
    <div class="header-title">
      <span>Amber Chat Directory</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="mute-btn" title="Toggle sounds">
        🔊 On
      </button>
      <button class="icon-btn" id="logout-btn" title="Logout">
        Logout
      </button>
    </div>
  </div>

  <div class="user-list"></div>
</div>

<div class="right-panel">
  <div class="panel-header" id="chat-header">
    <div class="header-title">
      Select a connected user to begin chatting
    </div>
  </div>

  <div class="chat-container">
    <div class="empty-chat">
      Select a connected user to begin chatting
    </div>
  </div>

  <div class="chat-input-area">
    <input
      type="text"
      class="message-input"
      placeholder="Type a message..."
      disabled
      autocomplete="off"
    />
    <button class="send-btn" disabled>Send</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
// ---------- Config ----------
const socket = io();

const urlParams = new URLSearchParams(window.location.search);
const myEmail = urlParams.get("user");

let activeChatUser = null;
let activeChatName = null;

// Sound
let soundsEnabled = true;
const ONLINE_SOUND_URL = "https://assets.mixkit.co/notifications/preview/mixkit-software-interface-start-2573.mp3"; // free, no auth
const onlineAudio = new Audio(ONLINE_SOUND_URL);
onlineAudio.volume = 0.5;

// ---------- DOM ----------
const userList = document.querySelector(".user-list");
const chatHeader = document.getElementById("chat-header");
const chatContainer = document.querySelector(".chat-container");
const messageInput = document.querySelector(".message-input");
const sendButton = document.querySelector(".send-btn");
const leftPanel = document.querySelector(".left-panel");
const rightPanel = document.querySelector(".right-panel");
const muteBtn = document.getElementById("mute-btn");
const logoutBtn = document.getElementById("logout-btn");

if (!myEmail) {
  window.location.href = "/";
}

// ---------- Helpers ----------
function safeId(email) {
  return encodeURIComponent(email).replace(/%/g, "-");
}

function getUserItem(email) {
  return document.getElementById(`item-${safeId(email)}`);
}

function getActionArea(email) {
  return document.getElementById(`action-${safeId(email)}`);
}

function getAlertDot(email) {
  return document.getElementById(`alert-${safeId(email)}`);
}

function getStatusDot(email) {
  return document.getElementById(`status-${safeId(email)}`);
}

function getStatusText(email) {
  return document.getElementById(`text-${safeId(email)}`);
}

function createActionButton(text, type, handler, email) {
  const button = document.createElement("button");
  button.className = `connect-btn ${type || ""}`;
  button.textContent = text;
  button.addEventListener("click", event => {
    event.stopPropagation();
    handler(email);
  });
  return button;
}

function createUserItem(user) {
  const item = document.createElement("div");
  item.className = "user-item";
  item.id = `item-${safeId(user.email)}`;

  if (activeChatUser === user.email) {
    item.classList.add("active-chat");
  }

  const userInfo = document.createElement("div");
  userInfo.className = "user-info";

  const avatarContainer = document.createElement("div");
  avatarContainer.className = "avatar-container";

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  const label = (user.name || user.email || "?").substring(0, 2).toUpperCase();
  avatar.textContent = label;

  const statusDot = document.createElement("div");
  statusDot.className = `status-dot ${user.isOnline ? "online" : ""}`;
  statusDot.id = `status-${safeId(user.email)}`;

  const alertDot = document.createElement("div");
  alertDot.className = "alert-dot";
  alertDot.id = `alert-${safeId(user.email)}`;

  avatarContainer.appendChild(avatar);
  avatarContainer.appendChild(statusDot);
  avatarContainer.appendChild(alertDot);

  const userMeta = document.createElement("div");
  userMeta.className = "user-meta";

  const username = document.createElement("span");
  username.className = "username";
  username.textContent = user.name || user.email;

  const statusText = document.createElement("span");
  statusText.className = "status-text";
  statusText.id = `text-${safeId(user.email)}`;
  statusText.textContent = user.isOnline ? "Online" : "Offline";

  userMeta.appendChild(username);
  userMeta.appendChild(statusText);

  userInfo.appendChild(avatarContainer);
  userInfo.appendChild(userMeta);

  const actionArea = document.createElement("div");
  actionArea.id = `action-${safeId(user.email)}`;
  actionArea.className = "action-area";

  if (user.isConnected) {
    const friends = document.createElement("span");
    friends.className = "friends";
    friends.textContent = "Friends";
    actionArea.appendChild(friends);

    item.addEventListener("click", () => {
      openChat(user.email, user.name || user.email);
    });
  } else {
    const button = createActionButton("Connect", "", requestConnection, user.email);
    actionArea.appendChild(button);
  }

  item.appendChild(userInfo);
  item.appendChild(actionArea);

  return item;
}

// ---------- Data loading ----------
async function loadDirectory() {
  try {
    const response = await fetch(`/api/users?user=${encodeURIComponent(myEmail)}`);
    if (!response.ok) throw new Error("Failed to load users");
    const users = await response.json();

    userList.innerHTML = "";

    if (!Array.isArray(users) || users.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty-chat";
      empty.textContent = "No users available";
      userList.appendChild(empty);
      return;
    }

    users.forEach(user => {
      if (!user.email || user.email === myEmail) return;
      userList.appendChild(createUserItem(user));
    });
  } catch (error) {
    userList.innerHTML = "";
    const errorMessage = document.createElement("div");
    errorMessage.className = "empty-chat";
    errorMessage.textContent = "Unable to load users";
    userList.appendChild(errorMessage);
  }
}

// ---------- Actions ----------
function requestConnection(targetEmail) {
  if (!targetEmail || targetEmail === myEmail) return;

  socket.emit("send-connect-request", {
    myEmail,
    targetEmail
  });

  const actionArea = getActionArea(targetEmail);
  if (!actionArea) return;

  actionArea.innerHTML = "";
  const requested = document.createElement("span");
  requested.className = "requested";
  requested.textContent = "Requested";
  actionArea.appendChild(requested);
}

function acceptConnection(targetEmail) {
  if (!targetEmail) return;

  socket.emit("confirm-connection", {
    myEmail,
    targetEmail
  });
}

async function openChat(targetEmail, targetName) {
  if (!targetEmail) return;

  activeChatUser = targetEmail;
  activeChatName = targetName || targetEmail;

  document.querySelectorAll(".user-item").forEach(item => {
    item.classList.remove("active-chat");
  });

  const item = getUserItem(targetEmail);
  if (item) item.classList.add("active-chat");

  chatHeader.querySelector(".header-title").textContent = `Chat with ${activeChatName}`;

  messageInput.disabled = false;
  sendButton.disabled = false;
  messageInput.focus();

  const alertDot = getAlertDot(targetEmail);
  if (alertDot) alertDot.classList.remove("active");

  socket.emit("mark-as-read", {
    myEmail,
    targetEmail
  });

  chatContainer.innerHTML = "";

  try {
    const response = await fetch(
      `/api/history?user=${encodeURIComponent(myEmail)}&target=${encodeURIComponent(targetEmail)}`
    );
    if (!response.ok) throw new Error("Failed to load history");
    const messages = await response.json();

    if (!Array.isArray(messages) || messages.length === 0) {
      showEmptyChat("No messages yet");
      return;
    }

    messages.forEach(message => appendToScreen(message));
    scrollChatToBottom();
  } catch (error) {
    showEmptyChat("Unable to load chat history");
  }

  if (window.innerWidth <= 700) {
    leftPanel.classList.add("chat-open");
    rightPanel.classList.add("chat-open");
  }
}

function showEmptyChat(text) {
  chatContainer.innerHTML = "";
  const empty = document.createElement("div");
  empty.className = "empty-chat";
  empty.textContent = text;
  chatContainer.appendChild(empty);
}

function sendMessage() {
  const text = messageInput.value.trim();
  if (!text || !activeChatUser) return;

  socket.emit("send-chat-message", {
    myEmail,
    targetEmail: activeChatUser,
    text
  });

  messageInput.value = "";
  messageInput.focus();
}

function appendToScreen(msg) {
  if (!msg || !msg.sender) return;

  const isMe = msg.sender === myEmail;

  const row = document.createElement("div");
  row.className = `msg-row ${isMe ? "sent" : "received"}`;

  const message = document.createElement("div");
  message.className = `message ${isMe ? "sent" : "received"}`;
  message.textContent = msg.text || "";

  const meta = document.createElement("div");
  meta.className = "msg-meta";

  const timestamp = document.createElement("span");
  timestamp.textContent = msg.timestamp || "";
  meta.appendChild(timestamp);

  if (isMe) {
    const status = document.createElement("span");
    status.className = `read-status ${msg.read ? "read" : "unread"}`;
    status.textContent = "✓✓";
    meta.appendChild(status);
  }

  row.appendChild(message);
  row.appendChild(meta);
  chatContainer.appendChild(row);

  scrollChatToBottom();
}

function scrollChatToBottom() {
  requestAnimationFrame(() => {
    chatContainer.scrollTop = chatContainer.scrollHeight;
  });
}

function updateUserStatus(email, online) {
  const dot = getStatusDot(email);
  const text = getStatusText(email);
  if (!dot || !text) return;

  const wasOnline = dot.classList.contains("online");
  dot.classList.toggle("online", Boolean(online));
  text.textContent = online ? "Online" : "Offline";

  // Play sound when a user comes online (and not already online)
  if (soundsEnabled && online && !wasOnline) {
    playOnlineSound();
  }
}

function playOnlineSound() {
  try {
    onlineAudio.currentTime = 0;
    onlineAudio.play().catch(() => {
      // Ignore autoplay restrictions; user interaction usually needed
    });
  } catch (e) {
    // ignore
  }
}

function handleIncomingConnectionRequest(data) {
  if (!data || !data.fromEmail) return;

  const actionArea = getActionArea(data.fromEmail);
  if (!actionArea) return;

  actionArea.innerHTML = "";
  const button = createActionButton("Confirm", "confirm", acceptConnection, data.fromEmail);
  actionArea.appendChild(button);
}

// ---------- Socket events ----------
socket.on("connect", () => {
  socket.emit("register-online", myEmail);
});

socket.on("status-update", data => {
  if (!data || !data.email) return;
  updateUserStatus(data.email, data.online);
});

socket.on("receive-connect-request", data => {
  handleIncomingConnectionRequest(data);
});

socket.on("connection-established", () => {
  loadDirectory();
});

socket.on("receive-chat-message", msg => {
  if (!msg || !msg.sender) return;

  if (activeChatUser === msg.sender) {
    appendToScreen(msg);
    socket.emit("mark-as-read", {
      myEmail,
      targetEmail: activeChatUser
    });
  } else {
    const alertDot = getAlertDot(msg.sender);
    if (alertDot) alertDot.classList.add("active");
  }
});

socket.on("message-sent-confirmation", msg => {
  if (!msg) return;
  if (activeChatUser === msg.receiver) {
    appendToScreen(msg);
  }
});

socket.on("messages-were-read", data => {
  if (!data || activeChatUser !== data.byUser) return;

  document.querySelectorAll(".read-status.unread").forEach(status => {
    status.classList.remove("unread");
    status.classList.add("read");
  });
});

// ---------- UI events ----------
messageInput.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

sendButton.addEventListener("click", sendMessage);

window.addEventListener("resize", () => {
  if (window.innerWidth > 700) {
    leftPanel.classList.remove("chat-open");
    rightPanel.classList.remove("chat-open");
  }
});

muteBtn.addEventListener("click", () => {
  soundsEnabled = !soundsEnabled;
  muteBtn.textContent = soundsEnabled ? "🔊 On" : "🔇 Off";
  muteBtn.title = soundsEnabled ? "Disable sounds" : "Enable sounds";
});

logoutBtn.addEventListener("click", () => {
  window.location.href = "/auth/logout";
});

document.addEventListener("DOMContentLoaded", () => {
  loadDirectory();
});
</script>

</body>
</html>
