<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amber Secure Chat Engine</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: system-ui, sans-serif;
}

body {
    display: flex;
    height: 100vh;
    background: #fef3c7;
    color: #451a03;
    overflow: hidden;
}

.left-panel {
    width: 380px;
    height: 100%;
    background: #fffbeb;
    border-right: 1px solid #fde68a;
    display: flex;
    flex-direction: column;
}

.panel-header {
    height: 65px;
    min-height: 65px;
    background: #f59e0b;
    color: white;
    display: flex;
    align-items: center;
    padding: 0 1rem;
    font-size: 1.2rem;
    font-weight: 700;
    gap: 10px;
}

.user-list {
    flex: 1;
    overflow-y: auto;
    padding: 0.5rem;
}

.user-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 0.75rem;
    margin-bottom: 0.5rem;
    background: white;
    border: 1px solid #fef3c7;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.15s ease;
}

.user-item:hover {
    border-color: #fcd34d;
    transform: translateY(-1px);
}

.user-item.active-chat {
    background: #fef08a;
    border-color: #f59e0b;
}

.user-info {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    position: relative;
    min-width: 0;
}

.avatar-container {
    position: relative;
    width: 45px;
    height: 45px;
    min-width: 45px;
}

.avatar {
    width: 100%;
    height: 100%;
    background: #d97706;
    color: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    user-select: none;
}

.status-dot {
    position: absolute;
    bottom: 0;
    right: 0;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    border: 2px solid white;
    background: #9ca3af;
}

.status-dot.online {
    background: #10b981;
    box-shadow: 0 0 6px #10b981;
}

.alert-dot {
    position: absolute;
    top: -2px;
    left: -2px;
    width: 14px;
    height: 14px;
    background: #ef4444;
    border-radius: 50%;
    border: 2px solid white;
    display: none;
}

.alert-dot.active {
    display: block;
}

.user-meta {
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.username {
    font-weight: 600;
    font-size: 0.95rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.status-text {
    font-size: 0.75rem;
    color: #78350f;
}

.connect-btn {
    padding: 0.4rem 0.8rem;
    background: #d97706;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
}

.connect-btn:hover {
    background: #b45309;
}

.connect-btn.confirm {
    background: #10b981;
}

.connect-btn.confirm:hover {
    background: #059669;
}

.requested {
    font-size: 0.75rem;
    color: #b45309;
    font-weight: 600;
}

.friends {
    font-size: 0.75rem;
    color: #10b981;
    font-weight: 700;
}

.right-panel {
    flex: 1;
    min-width: 0;
    height: 100%;
    background: #fffaf0;
    display: flex;
    flex-direction: column;
}

.chat-container {
    flex: 1;
    padding: 1.5rem;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    background-image: linear-gradient(
        135deg,
        rgba(254, 243, 199, 0.3) 0%,
        rgba(255, 255, 255, 0.5) 100%
    );
}

.empty-chat {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #92400e;
    text-align: center;
    font-size: 0.95rem;
}

.msg-row {
    display: flex;
    flex-direction: column;
    width: 100%;
}

.message {
    max-width: min(55%, 650px);
    padding: 0.65rem 0.85rem;
    border-radius: 14px;
    font-size: 0.95rem;
    position: relative;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
}

.message.sent {
    background: #fde68a;
    color: #78350f;
    align-self: flex-end;
    border-bottom-right-radius: 2px;
}

.message.received {
    background: white;
    color: #451a03;
    align-self: flex-start;
    border-bottom-left-radius: 2px;
    border: 1px solid #fde68a;
}

.msg-meta {
    font-size: 0.7rem;
    color: #92400e;
    margin-top: 2px;
    display: flex;
    gap: 5px;
    align-items: center;
}

.msg-row.sent .msg-meta {
    align-self: flex-end;
}

.msg-row.received .msg-meta {
    align-self: flex-start;
}

.read-status {
    font-weight: bold;
}

.read-status.read {
    color: #10b981;
}

.read-status.unread {
    color: #9ca3af;
}

.chat-input-area {
    min-height: 70px;
    background: #fffbeb;
    border-top: 1px solid #fde68a;
    display: flex;
    align-items: center;
    padding: 0 1.5rem;
    gap: 1rem;
}

.message-input {
    flex: 1;
    min-width: 0;
    padding: 0.75rem 1rem;
    border: 1px solid #fcd34d;
    border-radius: 24px;
    outline: none;
    font-size: 0.95rem;
    background: white;
}

.message-input:focus {
    border-color: #f59e0b;
    box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.12);
}

.send-btn {
    padding: 0.75rem 1.5rem;
    background: #d97706;
    color: white;
    border: none;
    border-radius: 24px;
    font-weight: 600;
    cursor: pointer;
}

.send-btn:hover:not(:disabled) {
    background: #b45309;
}

.send-btn:disabled,
.message-input:disabled {
    opacity: 0.55;
    cursor: not-allowed;
}

@media (max-width: 700px) {
    .left-panel {
        width: 100%;
    }

    .right-panel {
        display: none;
    }

    .left-panel.chat-open {
        display: none;
    }

    .right-panel.chat-open {
        display: flex;
    }

    .message {
        max-width: 80%;
    }
}
</style>
</head>

<body>

<div class="left-panel">
    <div class="panel-header">
        <span>Amber Chat Directory</span>
    </div>

    <div class="user-list"></div>
</div>

<div class="right-panel">
    <div class="panel-header" id="chat-header">
        Select a connected user to begin chatting
    </div>

    <div class="chat-container">
        <div class="empty-chat">
            Select a connected user to begin chatting
        </div>
    </div>

    <div class="chat-input-area">
        <input
            type="text"
            class="message-input"
            placeholder="Type a message..."
            disabled
            autocomplete="off"
        >

        <button class="send-btn" disabled>
            Send
        </button>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();

const urlParams = new URLSearchParams(window.location.search);
const myEmail = urlParams.get("user");

let activeChatUser = null;
let activeChatName = null;

const userList = document.querySelector(".user-list");
const chatHeader = document.getElementById("chat-header");
const chatContainer = document.querySelector(".chat-container");
const messageInput = document.querySelector(".message-input");
const sendButton = document.querySelector(".send-btn");
const leftPanel = document.querySelector(".left-panel");
const rightPanel = document.querySelector(".right-panel");

if (!myEmail) {
    window.location.href = "/";
}

function safeId(email) {
    return encodeURIComponent(email).replace(/%/g, "-");
}

function getUserItem(email) {
    return document.getElementById(`item-${safeId(email)}`);
}

function getActionArea(email) {
    return document.getElementById(`action-${safeId(email)}`);
}

function getAlertDot(email) {
    return document.getElementById(`alert-${safeId(email)}`);
}

function getStatusDot(email) {
    return document.getElementById(`status-${safeId(email)}`);
}

function getStatusText(email) {
    return document.getElementById(`text-${safeId(email)}`);
}

function createActionButton(text, type, handler, email) {
    const button = document.createElement("button");

    button.className = `connect-btn ${type || ""}`;
    button.textContent = text;

    button.addEventListener("click", event => {
        event.stopPropagation();
        handler(email);
    });

    return button;
}

function createUserItem(user) {
    const item = document.createElement("div");

    item.className = "user-item";
    item.id = `item-${safeId(user.email)}`;

    if (activeChatUser === user.email) {
        item.classList.add("active-chat");
    }

    const userInfo = document.createElement("div");
    userInfo.className = "user-info";

    const avatarContainer = document.createElement("div");
    avatarContainer.className = "avatar-container";

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = (user.name || user.email || "?")
        .substring(0, 2)
        .toUpperCase();

    const statusDot = document.createElement("div");
    statusDot.className = `status-dot ${user.isOnline ? "online" : ""}`;
    statusDot.id = `status-${safeId(user.email)}`;

    const alertDot = document.createElement("div");
    alertDot.className = "alert-dot";
    alertDot.id = `alert-${safeId(user.email)}`;

    avatarContainer.appendChild(avatar);
    avatarContainer.appendChild(statusDot);
    avatarContainer.appendChild(alertDot);

    const userMeta = document.createElement("div");
    userMeta.className = "user-meta";

    const username = document.createElement("span");
    username.className = "username";
    username.textContent = user.name || user.email;

    const statusText = document.createElement("span");
    statusText.className = "status-text";
    statusText.id = `text-${safeId(user.email)}`;
    statusText.textContent = user.isOnline ? "Online" : "Offline";

    userMeta.appendChild(username);
    userMeta.appendChild(statusText);

    userInfo.appendChild(avatarContainer);
    userInfo.appendChild(userMeta);

    const actionArea = document.createElement("div");
    actionArea.id = `action-${safeId(user.email)}`;

    if (user.isConnected) {
        const friends = document.createElement("span");
        friends.className = "friends";
        friends.textContent = "Friends";
        actionArea.appendChild(friends);

        item.addEventListener("click", () => {
            openChat(user.email, user.name || user.email);
        });
    } else {
        const button = createActionButton(
            "Connect",
            "",
            requestConnection,
            user.email
        );

        actionArea.appendChild(button);
    }

    item.appendChild(userInfo);
    item.appendChild(actionArea);

    return item;
}

async function loadDirectory() {
    try {
        const response = await fetch(
            `/api/users?user=${encodeURIComponent(myEmail)}`
        );

        if (!response.ok) {
            throw new Error("Failed to load users");
        }

        const users = await response.json();

        userList.innerHTML = "";

        if (!Array.isArray(users) || users.length === 0) {
            const empty = document.createElement("div");
            empty.className = "empty-chat";
            empty.textContent = "No users available";
            userList.appendChild(empty);
            return;
        }

        users.forEach(user => {
            if (!user.email || user.email === myEmail) {
                return;
            }

            userList.appendChild(createUserItem(user));
        });
    } catch (error) {
        userList.innerHTML = "";

        const errorMessage = document.createElement("div");
        errorMessage.className = "empty-chat";
        errorMessage.textContent = "Unable to load users";

        userList.appendChild(errorMessage);
    }
}

function requestConnection(targetEmail) {
    if (!targetEmail || targetEmail === myEmail) {
        return;
    }

    socket.emit("send-connect-request", {
        myEmail,
        targetEmail
    });

    const actionArea = getActionArea(targetEmail);

    if (!actionArea) {
        return;
    }

    actionArea.innerHTML = "";

    const requested = document.createElement("span");
    requested.className = "requested";
    requested.textContent = "Requested";

    actionArea.appendChild(requested);
}

function acceptConnection(targetEmail) {
    if (!targetEmail) {
        return;
    }

    socket.emit("confirm-connection", {
        myEmail,
        targetEmail
    });
}

async function openChat(targetEmail, targetName) {
    if (!targetEmail) {
        return;
    }

    activeChatUser = targetEmail;
    activeChatName = targetName || targetEmail;

    document.querySelectorAll(".user-item").forEach(item => {
        item.classList.remove("active-chat");
    });

    const item = getUserItem(targetEmail);

    if (item) {
        item.classList.add("active-chat");
    }

    chatHeader.textContent = `Chat with ${activeChatName}`;

    messageInput.disabled = false;
    sendButton.disabled = false;

    messageInput.focus();

    const alertDot = getAlertDot(targetEmail);

    if (alertDot) {
        alertDot.classList.remove("active");
    }

    socket.emit("mark-as-read", {
        myEmail,
        targetEmail
    });

    chatContainer.innerHTML = "";

    try {
        const response = await fetch(
            `/api/history?user=${encodeURIComponent(myEmail)}&target=${encodeURIComponent(targetEmail)}`
        );

        if (!response.ok) {
            throw new Error("Failed to load history");
        }

        const messages = await response.json();

        if (!Array.isArray(messages) || messages.length === 0) {
            showEmptyChat("No messages yet");
            return;
        }

        messages.forEach(message => {
            appendToScreen(message);
        });

        scrollChatToBottom();
    } catch (error) {
        showEmptyChat("Unable to load chat history");
    }

    if (window.innerWidth <= 700) {
        leftPanel.classList.add("chat-open");
        rightPanel.classList.add("chat-open");
    }
}

function showEmptyChat(text) {
    chatContainer.innerHTML = "";

    const empty = document.createElement("div");
    empty.className = "empty-chat";
    empty.textContent = text;

    chatContainer.appendChild(empty);
}

function sendMessage() {
    const text = messageInput.value.trim();

    if (!text || !activeChatUser) {
        return;
    }

    socket.emit("send-chat-message", {
        myEmail,
        targetEmail: activeChatUser,
        text
    });

    messageInput.value = "";
    messageInput.focus();
}

function appendToScreen(msg) {
    if (!msg || !msg.sender) {
        return;
    }

    const isMe = msg.sender === myEmail;

    const row = document.createElement("div");
    row.className = `msg-row ${isMe ? "sent" : "received"}`;

    const message = document.createElement("div");
    message.className = `message ${isMe ? "sent" : "received"}`;
    message.textContent = msg.text || "";

    const meta = document.createElement("div");
    meta.className = "msg-meta";

    const timestamp = document.createElement("span");
    timestamp.textContent = msg.timestamp || "";

    meta.appendChild(timestamp);

    if (isMe) {
        const status = document.createElement("span");

        status.className = `read-status ${msg.read ? "read" : "unread"}`;
        status.textContent = "✓✓";

        meta.appendChild(status);
    }

    row.appendChild(message);
    row.appendChild(meta);

    chatContainer.appendChild(row);

    scrollChatToBottom();
}

function scrollChatToBottom() {
    requestAnimationFrame(() => {
        chatContainer.scrollTop = chatContainer.scrollHeight;
    });
}

function updateUserStatus(email, online) {
    const dot = getStatusDot(email);
    const text = getStatusText(email);

    if (!dot || !text) {
        return;
    }

    dot.classList.toggle("online", Boolean(online));
    text.textContent = online ? "Online" : "Offline";
}

function handleIncomingConnectionRequest(data) {
    if (!data || !data.fromEmail) {
        return;
    }

    const actionArea = getActionArea(data.fromEmail);

    if (!actionArea) {
        return;
    }

    actionArea.innerHTML = "";

    const button = createActionButton(
        "Confirm",
        "confirm",
        acceptConnection,
        data.fromEmail
    );

    actionArea.appendChild(button);
}

socket.on("connect", () => {
    socket.emit("register-online", myEmail);
});

socket.on("status-update", data => {
    if (!data || !data.email) {
        return;
    }

    updateUserStatus(data.email, data.online);
});

socket.on("receive-connect-request", data => {
    handleIncomingConnectionRequest(data);
});

socket.on("connection-established", () => {
    loadDirectory();
});

socket.on("receive-chat-message", msg => {
    if (!msg || !msg.sender) {
        return;
    }

    if (activeChatUser === msg.sender) {
        appendToScreen(msg);

        socket.emit("mark-as-read", {
            myEmail,
            targetEmail: activeChatUser
        });
    } else {
        const alertDot = getAlertDot(msg.sender);

        if (alertDot) {
            alertDot.classList.add("active");
        }
    }
});

socket.on("message-sent-confirmation", msg => {
    if (!msg) {
        return;
    }

    if (activeChatUser === msg.receiver) {
        appendToScreen(msg);
    }
});

socket.on("messages-were-read", data => {
    if (!data || activeChatUser !== data.byUser) {
        return;
    }

    document
        .querySelectorAll(".read-status.unread")
        .forEach(status => {
            status.classList.remove("unread");
            status.classList.add("read");
        });
});

messageInput.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }
});

sendButton.addEventListener("click", sendMessage);

window.addEventListener("resize", () => {
    if (window.innerWidth > 700) {
        leftPanel.classList.remove("chat-open");
        rightPanel.classList.remove("chat-open");
    }
});

document.addEventListener("DOMContentLoaded", () => {
    loadDirectory();
});
</script>

</body>
</html>
